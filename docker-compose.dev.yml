version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: payload-news-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: payload-news
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - payload-network

  # Payload CMS Backend (Development)
  backend:
    image: node:18-alpine
    container_name: payload-news-backend-dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/payload-news
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-development-secret-change-in-production}
      - PORT=3000
      - PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3000
      - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
      - ./media:/app/media
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongodb
    networks:
      - payload-network

  # Next.js Frontend (Development)
  frontend:
    image: node:18-alpine
    container_name: payload-news-frontend-dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - payload-network

networks:
  payload-network:
    driver: bridge

volumes:
  mongodb_dev_data:
